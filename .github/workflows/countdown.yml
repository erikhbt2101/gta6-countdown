name: GTA VI Discord countdown
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Update Discord channel name
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID }}
          RELEASE_DATETIME: '2026-11-19T00:00:00+01:00'
        run: python update_channel.py
